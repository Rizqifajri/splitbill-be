version: '3.8'

services:
  # 1. Database PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: splitbill_db
    restart: always
    ports:
      - '5432:5432' # Mapping port container ke localhost
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: splitbilldb
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. PgAdmin (GUI untuk lihat Database, opsional tapi sangat membantu)
  pgadmin:
    image: dpage/pgadmin4
    container_name: splitbill_pgadmin
    restart: always
    ports:
      - '5050:80'
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - postgres

volumes:
  postgres_data: